name: KCMC backup retention

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/backup-retention.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/save.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/content-restore.php'
      - 'tests/backup-retention-contract.php'
      - '.github/workflows/backup-retention.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/backup-retention.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/save.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/content-restore.php'
      - 'tests/backup-retention-contract.php'
      - '.github/workflows/backup-retention.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/backup-retention.php
          php -l KCMC-Connect-Phase6-Recreated/admin/save.php
          php -l KCMC-Connect-Phase6-Recreated/lib/content-restore.php
      - name: Backup retention contracts
        run: php tests/backup-retention-contract.php
