name: KCMC narrow owner UI and account guards

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/member/notifications.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/password-lifecycle.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/users.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/password-resets.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/bootstrap.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/operations-owner.php'
      - 'tests/owner-ui-narrow-*.py'
      - 'tests/fixtures/push-owner-link-reviewed.json'
      - 'tests/fixtures/owner-account-guard-reviewed.json'
      - 'tests/installed-reconciliation-source.py'
      - 'tests/workflow_source_layer.py'
      - 'tests/workflow-source-negative.py'
      - 'tests/fixtures/workflow-journeys-reviewed.json'
      - '.github/workflows/owner-ui-narrow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-ui-and-target-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Supported PHP 8.3 runtime
        run: |
          php -v
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "This contract job requires the Ubuntu 24.04 PHP 8.3 runtime.\n"); exit(1); }'
      - name: Narrow runtime syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/member/notifications.php
          php -l KCMC-Connect-Phase6-Recreated/lib/password-lifecycle.php
          php -l KCMC-Connect-Phase6-Recreated/admin/users.php
          php -l KCMC-Connect-Phase6-Recreated/admin/password-resets.php
      - name: Fetch pinned historical proof objects (read only)
        run: |
          git fetch --no-tags origin 93c72f4fc430d311e01108d3a30d0561bb701c9d
          git fetch --no-tags origin f7cc02ab1da1f3b5059b59c27822997e1541fef4 1af697ac828724a74ba15f9c7167f09b45e35f89 636dfa89e2d1cd0346741af732e385c950c54513 b18454042ddeb19e069821ea9a238b40335c780b 4e7ddeb82c498aab0183a9e500ffa4289091e5aa 4225fce8968747ad4f828a9a36087b04fd020484 b6093050dafe9a8d5b2ad4d958fdae742bc06624 2146af219d2fd23136eae1685f91a2a2caec030e 2c767fd66299524a126f39c5350de8dac1ce1f85 225c564138242f699a1bd31c75b5c78e65268ca7 b1fe32017781be8a570ae114148d66fca82bc867 c19214a0078ae8a4d306954a76ca4a8f96dadcb2 61c70f590735522adbfd6be02dab6888924a54fd f4442fc4cce2121828544b79b8ba3591c5fe0dab 54383f8b3436c8232d876a799a0f6c649e91f397
      - name: Full historical and exact narrow source proofs
        run: |
          python3 tests/installed-reconciliation-source.py
          python3 tests/owner-ui-narrow-source.py
          python3 tests/workflow-source-negative.py
      - name: Historical real PHP routes on exact workflow preimages
        run: python3 tests/owner-ui-narrow-routes.py
      - name: Current account and owner authorization route guards
        run: python3 tests/owner-ui-narrow-routes.py --current-account-guards
      - name: Exact prior-source behavior negative controls
        run: python3 tests/owner-ui-narrow-negative.py
      - name: Existing password lifecycle and owner privacy contracts
        run: |
          php tests/password-lifecycle-contract.php
          php tests/owner-capabilities.php
      - name: Untouched original password contract on exact historical source
        run: python3 tests/workflow_source_layer.py --historical-password-contract
