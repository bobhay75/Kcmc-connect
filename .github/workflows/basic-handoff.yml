name: Basic church handoff
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find KCMC-Connect-Phase6-Recreated -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Basic handoff HTTP acceptance
        run: python3 tests/basic-handoff-http.py
      - name: Release package build guard
        run: |
          python3 -m py_compile tools/basic-handoff/build.py tests/basic-handoff-http.py
          test "$(grep -Fc '/bin/false' .cpanel.yml)" -ge 1
      - name: Verify no private development ledger in candidate
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          python3 tools/basic-handoff/build.py "$tmp/release"
          if find "$tmp/release" -type f | grep -Ei '(^|/)(time.?ledger|private.?ledger|SETUP-CREDENTIALS|\.env)(\.|$)'; then
            echo 'Private development material found in release candidate' >&2
            exit 1
          fi
          test ! -e "$tmp/release/data/private"
          test ! -e "$tmp/release/config.php"
      - name: JavaScript syntax
        run: node --check KCMC-Connect-Phase6-Recreated/sw.js
