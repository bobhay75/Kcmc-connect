name: Basic church handoff
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find KCMC-Connect-Phase6-Recreated -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Basic handoff HTTP acceptance
        run: python3 tests/basic-handoff-http.py
      - name: Release package build guard
        run: |
          python3 -m py_compile tools/basic-handoff/build.py tests/basic-handoff-http.py
          test "$(grep -Fc '/bin/false' .cpanel.yml)" -ge 1
      - name: Verify no private development ledger in candidate
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          python3 tools/basic-handoff/build.py "$tmp/release"
          if find "$tmp/release" -type f | grep -Ei '(^|/)(time.?ledger|private.?ledger|SETUP-CREDENTIALS|\.env)(\.|$)'; then
            echo 'Private development material found in release candidate' >&2
            exit 1
          fi
          test ! -e "$tmp/release/data/private"
          test ! -e "$tmp/release/config.php"
      - name: Assemble review-only release archive
        run: |
          mkdir -p "$RUNNER_TEMP/kcmc-artifacts"
          python3 tools/basic-handoff/build.py "$RUNNER_TEMP/kcmc-artifacts/KCMC-Connect-Review"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, os
          root = Path(os.environ['RUNNER_TEMP']) / 'kcmc-artifacts'
          app = root / 'KCMC-Connect-Review'
          archive = root / 'KCMC-Connect-Review.zip'
          forbidden = {'config.php', 'SETUP-CREDENTIALS.txt', '.env'}
          files = sorted(p for p in app.rglob('*') if p.is_file())
          for p in files:
              relative = p.relative_to(app)
              assert not p.is_symlink()
              assert not any(part in {'private', '.git', '__pycache__'} for part in relative.parts)
              assert p.name not in forbidden
              assert not any(word in p.name.lower() for word in ('time-ledger', 'private-ledger'))
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, (Path('KCMC-Connect-Review') / p.relative_to(app)).as_posix())
          (root / 'SHA256SUMS.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\\n')
          print(f'Review archive created: {len(files)} files')
          PY
      - name: Upload review archive (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: kcmc-review-candidate
          path: |
            ${{ runner.temp }}/kcmc-artifacts/KCMC-Connect-Review.zip
            ${{ runner.temp }}/kcmc-artifacts/SHA256SUMS.txt
          retention-days: 7
      - name: JavaScript syntax
        run: node --check KCMC-Connect-Phase6-Recreated/sw.js
