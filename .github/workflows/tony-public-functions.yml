name: Tony public function acceptance
on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/**'
      - 'tests/tony-public-functions*'
      - 'tests/visitor-welcome-contract.php'
      - '.github/workflows/tony-public-functions.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Public behavior, intake, mail and cache contracts
        run: |
          set -euo pipefail
          php tests/tony-public-functions-contract.php
          php tests/visitor-welcome-contract.php
          php tests/connection-intake-contract.php
          php tests/publishing-calendar-contract.php
          node tests/welcome-home-source.cjs
          node tests/pwa-cache-privacy.cjs
          node --check KCMC-Connect-Phase6-Recreated/app.js
          node --check KCMC-Connect-Phase6-Recreated/public-presentation.js
          git diff --check
      - name: Install test browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Synthetic phone, desktop, mail and signed-in acceptance
        run: |
          set -euo pipefail
          python3 tests/tony-public-functions-browser.py
          python3 tests/visitor-welcome-browser.py
          python3 tests/signed-in-workflows-browser.py
          python3 tests/publication-all-controls-browser.py
