name: Apply verified Publisher interaction source
on:
  push:
    branches: ['fix/publication-editor-interaction-20261009']
    paths: ['.github/workflows/publication-interaction-apply-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/publication-editor-interaction-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify payload and apply to feature branch only
        run: |
          python3 <<'PY'
          import base64, hashlib, json, re, subprocess, zlib
          from pathlib import Path
          source = Path('.github/workflows/publication-interaction-build-once.yml').read_text()
          packed = re.search(r"packed = '([^']+)'", source).group(1)
          packed = packed.replace('VBW43R+eijkf', 'VBW43R+ijkf').replace('qd5HRJBJBsg1RB857', 'qd5HRJBsg1RB857')
          raw = zlib.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '6da1e010239b791fe71f5b401874712c4cbed398f6afa9ebcaec0f15ed9c505c'
          data = json.loads(raw)
          assert data['base'] == 'b6093050dafe9a8d5b2ad4d958fdae742bc06624'
          allowed = {'KCMC-Connect-Phase6-Recreated/admin/publication-designer.php', 'tests/installed-reconciliation-source.py', 'tests/fixtures/publication-interaction-reviewed.json', 'tests/publication-interaction-browser.py', '.github/workflows/publication-interaction.yml', 'docs/publication-interaction-2026-10-09.md'}
          assert set(data['replacements']) | set(data['new_files']) == allowed
          for name, sha in data['baseline_blobs'].items():
              assert subprocess.check_output(['git', 'hash-object', name]).decode().strip() == sha, name
          for name, changes in data['replacements'].items():
              path = Path(name)
              content = path.read_text()
              for old, new in changes:
                  assert content.count(old) == 1, name + ': ambiguous patch anchor'
                  content = content.replace(old, new, 1)
              path.write_text(content)
          for name, content in data['new_files'].items():
              path = Path(name)
              if path.exists():
                  assert path.read_text() == content, name + ': existing file differs'
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
          subprocess.run(['php', '-l', 'KCMC-Connect-Phase6-Recreated/admin/publication-designer.php'], check=True)
          subprocess.run(['python3', '-m', 'py_compile', 'tests/publication-interaction-browser.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert staged == allowed - {'.github/workflows/publication-interaction.yml'}, staged
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Repair Publisher text entry and resize controls with real-input regressions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/publication-editor-interaction-20261009'], check=True)
          PY
