name: KCMC password lifecycle

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/password-lifecycle.php'
      - 'KCMC-Connect-Phase6-Recreated/member/password.php'
      - 'KCMC-Connect-Phase6-Recreated/member/reset-password.php'
      - 'KCMC-Connect-Phase6-Recreated/member/login.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/password-resets.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'tests/password-lifecycle-contract.php'
      - '.github/workflows/password-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/password-lifecycle.php'
      - 'KCMC-Connect-Phase6-Recreated/member/password.php'
      - 'KCMC-Connect-Phase6-Recreated/member/reset-password.php'
      - 'KCMC-Connect-Phase6-Recreated/member/login.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/password-resets.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'tests/password-lifecycle-contract.php'
      - '.github/workflows/password-lifecycle.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/password-lifecycle.php
          php -l KCMC-Connect-Phase6-Recreated/member/password.php
          php -l KCMC-Connect-Phase6-Recreated/member/reset-password.php
          php -l KCMC-Connect-Phase6-Recreated/member/login.php
          php -l KCMC-Connect-Phase6-Recreated/member/index.php
          php -l KCMC-Connect-Phase6-Recreated/admin/password-resets.php
          php -l KCMC-Connect-Phase6-Recreated/lib/audit-history.php
      - name: Password lifecycle contracts
        run: php tests/password-lifecycle-contract.php
