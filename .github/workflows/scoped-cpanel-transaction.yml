name: KCMC scoped cPanel transaction
on:
  pull_request:
    paths:
      - 'tools/kcmc-scoped-release/**'
      - '.github/workflows/scoped-cpanel-transaction.yml'
permissions:
  contents: read
jobs:
  reviewed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch known host source object (read only)
        run: git fetch --no-tags origin ae004a659a7c2fb334296fa41f54dd5263f4d5c0
      - name: Verify immutable source pins and transaction fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/kcmc-scoped-release/verify-inventory.py
          python3 tools/kcmc-scoped-release/test_installer.py
          python3 tools/kcmc-scoped-release/test_content_review.py
  host-python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run isolated fixtures on the host's Python 3.6 generation
        run: |
          set -euo pipefail
          docker pull python:3.6.15-slim-buster
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/review:ro" -w /review python:3.6.15-slim-buster python tools/kcmc-scoped-release/test_installer.py
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/review:ro" -w /review python:3.6.15-slim-buster python tools/kcmc-scoped-release/test_content_review.py
