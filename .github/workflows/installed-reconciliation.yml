name: KCMC installed runtime reconciliation
on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/**'
      - 'tests/**'
      - 'docs/installed-reconciliation-2026-10-03.*'
      - '.github/workflows/installed-reconciliation.yml'
permissions:
  contents: read
jobs:
  verify-installed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch reviewed source objects (read only)
        run: |
          git fetch --no-tags origin b6093050dafe9a8d5b2ad4d958fdae742bc06624 2146af219d2fd23136eae1685f91a2a2caec030e 2c767fd66299524a126f39c5350de8dac1ce1f85 225c564138242f699a1bd31c75b5c78e65268ca7 b1fe32017781be8a570ae114148d66fca82bc867 c19214a0078ae8a4d306954a76ca4a8f96dadcb2 61c70f590735522adbfd6be02dab6888924a54fd f4442fc4cce2121828544b79b8ba3591c5fe0dab
      - name: Verify exact runtime, scope and preserved sources
        run: |
          set -euo pipefail
          mkdir -p reconciliation-artifacts
          python3 tests/installed-reconciliation-source.py | tee reconciliation-artifacts/source.txt
          git diff --check 2146af219d2fd23136eae1685f91a2a2caec030e
          git diff --stat 2146af219d2fd23136eae1685f91a2a2caec030e > reconciliation-artifacts/diff-stat.txt
      - name: Security, PHP and production-smoke fixtures
        run: |
          set -euo pipefail
          php -r 'foreach (["curl", "openssl"] as $e) { if (!extension_loaded($e)) exit(1); }'
          bash tests/security-contract.sh | tee reconciliation-artifacts/security.txt
          bash tests/production-smoke-contract.sh | tee reconciliation-artifacts/production-smoke-fixtures.txt
          node --check KCMC-Connect-Phase6-Recreated/public-presentation.js
          node tests/public-photo-offline-source.cjs | tee reconciliation-artifacts/public-photo-offline-source.txt
          node tests/publication-fidelity-source.cjs | tee reconciliation-artifacts/publication-fidelity-source.txt
          for f in tests/*contract.php; do php "$f"; done | tee reconciliation-artifacts/php-contracts.txt
      - name: Install browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Browser, staff entry and private-page readability
        env:
          KCMC_REVIEW_OUTPUT: /tmp/kcmc-reconciliation-public
          KCMC_RECONCILIATION_OUTPUT: /tmp/kcmc-reconciliation-private
        run: |
          set -euo pipefail
          python3 tests/tony-launch-cleanup-browser.py | tee reconciliation-artifacts/public-browser.txt
          python3 tests/visible-photos-review.py | tee reconciliation-artifacts/photo-browser.txt
          python3 tests/publication-supplied-images-browser.py | tee reconciliation-artifacts/publication-images.txt
          python3 tests/signed-in-workflows-browser.py | tee reconciliation-artifacts/signed-in-browser.txt
          python3 tests/installed-reconciliation-browser.py | tee reconciliation-artifacts/staff-readability-browser.txt
          python3 tests/publication-text-roundtrip-browser.py | tee reconciliation-artifacts/publication-text-browser.txt
          python3 tests/publication-save-race-browser.py | tee reconciliation-artifacts/publication-save-browser.txt
          python3 tests/contemporary-bright-browser.py | tee reconciliation-artifacts/contemporary-bright-browser.txt
          python3 tests/public-photo-offline-browser.py | tee reconciliation-artifacts/public-photo-offline-browser.txt
          python3 tests/publication-fidelity-browser.py | tee reconciliation-artifacts/publication-fidelity-browser.txt
      - name: Reproduce each Publisher defect on pinned previous source
        run: |
          python3 <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import tempfile
          base = '61c70f590735522adbfd6be02dab6888924a54fd'
          pins = {'publication-designer.php': 'fe401dba16db2bf2611dc2f8199965d6faad423efcfd085f0e65a14794329793', 'publication-projects.php': 'aaf667a192407869f5d0255dcb648f3253c41671423578cf39d1866a2aeab205'}
          expected = {'whitespace': 'Authored boundary tabs/spaces/blank lines lost by real PHP validator', 'black': 'Opaque black was serialized as white', 'postcard': 'Postcard landscape must be 6×4 inches', 'upload': 'New: stale upload overwrote the current editor status'}
          with tempfile.TemporaryDirectory(prefix='kcmc-publisher-previous-') as td:
              app = Path(td)
              (app / 'admin').mkdir()
              for name, sha in pins.items():
                  raw = subprocess.check_output(['git', 'show', base + ':KCMC-Connect-Phase6-Recreated/admin/' + name])
                  assert hashlib.sha256(raw).hexdigest() == sha
                  (app / 'admin' / name).write_bytes(raw)
              for case, marker in expected.items():
                  result = subprocess.run(['python3', 'tests/publication-fidelity-browser.py', '--app', str(app), '--case', case], capture_output=True, text=True)
                  output = result.stdout + result.stderr
                  Path('reconciliation-artifacts/publication-negative-' + case + '.txt').write_text(output)
                  assert result.returncode != 0 and marker in output, case + ': expected semantic defect was not reproduced'
                  print('PASS: pinned previous source reproduces ' + case)
              for case, marker in [('new', '51st save must preserve every existing publication'), ('update', 'update must preserve every other existing publication')]:
                  result = subprocess.run(['php', 'tests/publication-project-retention-contract.php', str(app / 'admin/publication-projects.php'), case], capture_output=True, text=True)
                  output = result.stdout + result.stderr
                  Path('reconciliation-artifacts/publication-retention-negative-' + case + '.txt').write_text(output)
                  assert result.returncode != 0 and marker in output, case + ': expected project retention defect was not reproduced'
                  print('PASS: pinned previous source reproduces project retention ' + case)
          PY
      - name: Retain review evidence (no deployment)
        if: always()
        run: |
          mkdir -p reconciliation-artifacts
          git rev-parse HEAD > reconciliation-artifacts/SOURCE-COMMIT.txt
          cp docs/installed-reconciliation-2026-10-03.json reconciliation-artifacts/
          if [ -d /tmp/kcmc-reconciliation-public ]; then cp -a /tmp/kcmc-reconciliation-public reconciliation-artifacts/public-screenshots; fi
          if [ -d /tmp/kcmc-reconciliation-private ]; then cp -a /tmp/kcmc-reconciliation-private reconciliation-artifacts/private-fixture-screenshots; fi
          if [ -d photo-review-artifacts ]; then cp -a photo-review-artifacts reconciliation-artifacts/photo-review; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcmc-installed-reconciliation
          path: reconciliation-artifacts/
          retention-days: 7
