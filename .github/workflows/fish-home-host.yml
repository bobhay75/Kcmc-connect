name: KCMC fish homepage hosting repair
on:
  pull_request:
    paths:
      - 'tools/kcmc-fish-home-oct14/**'
      - 'KCMC-Connect-Phase6-Recreated/index.php'
      - 'KCMC-Connect-Phase6-Recreated/public-presentation.css'
      - 'KCMC-Connect-Phase6-Recreated/sw.js'
      - '.github/workflows/fish-home-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-python-node-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact generation, worker syntax, source and transaction checks
        run: |
          set -euo pipefail
          cd tools/kcmc-fish-home-oct14
          sha256sum -c CHECKSUMS.sha256
          python3 -B derive_installer.py
          git diff --exit-code -- installer.py provenance.json
          node --check ../../KCMC-Connect-Phase6-Recreated/sw.js
          python3 -B test_installer.py --runtime-root ../../KCMC-Connect-Phase6-Recreated
          python3 -B test_inherited_safety.py
      - name: Real PHP 8.2 temporary transaction
        run: |
          set -euo pipefail
          docker pull php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee
          kcmc_ci_php=$(mktemp -d)
          trap 'rm -f -- "$kcmc_ci_php/php"; rmdir -- "$kcmc_ci_php"' EXIT
          cat > "$kcmc_ci_php/php" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$#" -eq 3 ] && [ "$1" = '-n' ] && [ "$2" = '-l' ]; then
            kcmc_ci_stage=$(dirname -- "$3")
            exec docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$kcmc_ci_stage,dst=$kcmc_ci_stage,readonly" \
              php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          fi
          exec docker run --rm --network none --user "$(id -u):$(id -g)" \
            php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          SH
          chmod 0700 "$kcmc_ci_php/php"
          python3 -B tools/kcmc-fish-home-oct14/verify-stage.py --php "$kcmc_ci_php/php"
  python36:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Actual Python 3.6 exact variants and temporary transactions
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            -w /source/tools/kcmc-fish-home-oct14 \
            python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -c 'set -e; python3 -B test_installer.py --runtime-root ../../KCMC-Connect-Phase6-Recreated; python3 -B test_inherited_safety.py'
