name: Build temporary PHP test runtime
on:
  pull_request:
    paths:
      - '.github/workflows/basic-handoff-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect runner PHP and shared libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/lib
          cp -L "$(command -v php)" runtime/php
          ldd runtime/php | awk '/=> \/.* / {print $3} /^\// {print $1}' | while IFS= read -r library; do cp -L "$library" runtime/lib/; done
          runtime/php -n -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: php-runner-runtime
          path: runtime/
          retention-days: 1
          if-no-files-found: error
