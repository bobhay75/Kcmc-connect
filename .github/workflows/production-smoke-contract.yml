name: KCMC production smoke contract

on:
  pull_request:
    paths:
      - 'tools/production-smoke.sh'
      - 'tests/production-smoke-contract.sh'
      - 'tests/production-smoke-mock.sh'
      - '.github/workflows/production-smoke-contract.yml'
      - 'KCMC-Connect-Phase6-Recreated/index.php'
      - 'KCMC-Connect-Phase6-Recreated/.htaccess'
  push:
    branches: [main]
    paths:
      - 'tools/production-smoke.sh'
      - 'tests/production-smoke-contract.sh'
      - 'tests/production-smoke-mock.sh'
      - '.github/workflows/production-smoke-contract.yml'
      - 'KCMC-Connect-Phase6-Recreated/index.php'
      - 'KCMC-Connect-Phase6-Recreated/.htaccess'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shell syntax
        run: |
          bash -n tools/production-smoke.sh
          bash -n tests/production-smoke-contract.sh
          bash -n tests/production-smoke-mock.sh
      - name: Smoke source contracts
        run: bash tests/production-smoke-contract.sh
      - name: Mocked smoke execution
        run: bash tests/production-smoke-mock.sh
