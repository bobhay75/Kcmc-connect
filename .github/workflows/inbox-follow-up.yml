name: KCMC inbox follow-up status

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/connections.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/rsvps.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/inbox-follow-up.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'tests/inbox-follow-up-contract.php'
      - '.github/workflows/inbox-follow-up.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/connections.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/rsvps.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/inbox-follow-up.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'tests/inbox-follow-up-contract.php'
      - '.github/workflows/inbox-follow-up.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/inbox-follow-up.php
          php -l KCMC-Connect-Phase6-Recreated/lib/audit-history.php
          php -l KCMC-Connect-Phase6-Recreated/admin/connections.php
          php -l KCMC-Connect-Phase6-Recreated/admin/rsvps.php
          php -l tests/inbox-follow-up-contract.php
      - name: Inbox follow-up contract
        run: php tests/inbox-follow-up-contract.php
