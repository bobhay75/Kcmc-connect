name: KCMC post controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/post-controls.php
          php -l KCMC-Connect-Phase6-Recreated/admin/posts.php
          php -l KCMC-Connect-Phase6-Recreated/admin/index.php
          php -l KCMC-Connect-Phase6-Recreated/admin/save.php
          php -l KCMC-Connect-Phase6-Recreated/lib/bootstrap.php
      - name: Deletion, restoration and weekly recurrence
        run: php tests/post-controls-contract.php
