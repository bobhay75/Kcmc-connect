name: KCMC app theme and page navigation
on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/**'
      - 'tests/app-theme-browser.py'
      - '.github/workflows/app-theme.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/**'
      - 'tests/app-theme-browser.py'
      - '.github/workflows/app-theme.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Syntax and PHP route coverage
        run: |
          python3 -m py_compile tests/app-theme-browser.py
          find KCMC-Connect-Phase6-Recreated -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check KCMC-Connect-Phase6-Recreated/app-navigation.js
          git diff --check
          python3 tests/app-theme-browser.py --http-only
      - name: Browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Real app at phone and desktop widths
        run: python3 tests/app-theme-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kcmc-app-theme-renders
          path: test-artifacts/app-theme/
          retention-days: 7
          if-no-files-found: ignore
