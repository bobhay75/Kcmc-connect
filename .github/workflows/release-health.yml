name: KCMC release health

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/health.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/release-health.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'tests/release-health-contract.php'
      - '.github/workflows/release-health.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/health.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/release-health.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'tests/release-health-contract.php'
      - '.github/workflows/release-health.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/release-health.php
          php -l KCMC-Connect-Phase6-Recreated/admin/health.php
          php -l KCMC-Connect-Phase6-Recreated/member/index.php
      - name: Release health contracts
        run: php tests/release-health-contract.php
