name: KCMC invitation delivery

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/users.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.js'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.css'
      - 'KCMC-Connect-Phase6-Recreated/lib/invitation-delivery.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/invitation-mailer.php'
      - 'KCMC-Connect-Phase6-Recreated/member/activate.php'
      - 'KCMC-Connect-Phase6-Recreated/member/login.php'
      - 'KCMC-Connect-Phase6-Recreated/member/first-login.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/bootstrap.php'
      - 'KCMC-Connect-Phase6-Recreated/member/prayer-team.php'
      - 'KCMC-Connect-Phase6-Recreated/member/submit-prayer.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/prayers.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/index.php'
      - 'tests/invitation-delivery*'
      - 'tests/invitation-mailer.php'
      - 'tests/invitation-activation.php'
      - 'tests/member-onboarding-contract.php'
      - 'tests/role-boundaries.php'
      - 'tests/publishing-calendar-contract.php'
      - '.github/workflows/invitation-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/users.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.js'
      - 'KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.css'
      - 'KCMC-Connect-Phase6-Recreated/lib/invitation-delivery.php'
      - 'KCMC-Connect-Phase6-Recreated/member/activate.php'
      - 'KCMC-Connect-Phase6-Recreated/member/login.php'
      - 'KCMC-Connect-Phase6-Recreated/member/first-login.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/bootstrap.php'
      - 'KCMC-Connect-Phase6-Recreated/member/prayer-team.php'
      - 'KCMC-Connect-Phase6-Recreated/member/submit-prayer.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/prayers.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/index.php'
      - 'tests/invitation-delivery*'
      - 'tests/invitation-activation.php'
      - 'tests/member-onboarding-contract.php'
      - 'tests/role-boundaries.php'
      - 'tests/publishing-calendar-contract.php'
      - '.github/workflows/invitation-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify PHP, JavaScript and focused invitation contracts
        run: |
          php -v
          php -l KCMC-Connect-Phase6-Recreated/admin/users.php
          php -l KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.php
          php -l KCMC-Connect-Phase6-Recreated/lib/invitation-delivery.php
          php -l KCMC-Connect-Phase6-Recreated/lib/invitation-mailer.php
          php -l KCMC-Connect-Phase6-Recreated/member/activate.php
          php -l KCMC-Connect-Phase6-Recreated/member/login.php
          php -l KCMC-Connect-Phase6-Recreated/member/first-login.php
          php -l KCMC-Connect-Phase6-Recreated/lib/bootstrap.php
          php -l KCMC-Connect-Phase6-Recreated/member/prayer-team.php
          php -l KCMC-Connect-Phase6-Recreated/member/submit-prayer.php
          php -l KCMC-Connect-Phase6-Recreated/member/index.php
          php -l KCMC-Connect-Phase6-Recreated/admin/prayers.php
          php -l KCMC-Connect-Phase6-Recreated/admin/index.php
          php -l tests/invitation-activation.php
          php -l tests/member-onboarding-contract.php
          php -l tests/role-boundaries.php
          php -l tests/publishing-calendar-contract.php
          node --check KCMC-Connect-Phase6-Recreated/admin/invitation-delivery.js
          php tests/invitation-delivery.php
          php tests/invitation-mailer.php
          php tests/invitation-activation.php
          php tests/member-onboarding-contract.php
          php tests/role-boundaries.php
          php tests/publishing-calendar-contract.php
          node --test tests/invitation-delivery.cjs
          git diff --check

      - name: Install browser acceptance dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir playwright
          python3 -m playwright install --with-deps chromium

      - name: Run full-app invitation acceptance
        run: python3 tests/invitation-delivery-browser.py
