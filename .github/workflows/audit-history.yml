name: KCMC audit history

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/audit.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'tests/audit-history-contract.php'
      - '.github/workflows/audit-history.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/audit.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/audit-history.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'tests/audit-history-contract.php'
      - '.github/workflows/audit-history.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/audit-history.php
          php -l KCMC-Connect-Phase6-Recreated/admin/audit.php
          php -l KCMC-Connect-Phase6-Recreated/member/index.php
      - name: Audit history contracts
        run: php tests/audit-history-contract.php
