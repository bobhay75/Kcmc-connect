name: KCMC three-file hosting transaction
on:
  pull_request:
    paths:
      - 'tools/kcmc-minimal-repair-oct14/**'
      - 'KCMC-Connect-Phase6-Recreated/lib/timeclock.php'
      - 'KCMC-Connect-Phase6-Recreated/member/activate.php'
      - 'KCMC-Connect-Phase6-Recreated/member/reset-password.php'
      - 'tests/workflow_source_layer.py'
      - 'tests/phase_two_source_layer.py'
      - 'tests/fixtures/phase-two-workflows-reviewed.json'
      - 'tests/fixtures/workflow-journeys-reviewed.json'
      - '.github/workflows/minimal-host-transaction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-python-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact historical workflow baseline
        run: git fetch --no-tags origin 00fdd469482564a3511a29a27a99502c24a32845 9cf2087ebc1608ea4fbf2f2a7cd68553de004964
      - name: Historical transaction and independent failure fixtures
        run: |
          set -euo pipefail
          kcmc_minimal_historical=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_minimal_historical"' EXIT
          python3 tests/workflow_source_layer.py --baseline-output "$kcmc_minimal_historical/app"
          python3 tools/kcmc-minimal-repair-oct14/test_installer.py --runtime-root "$kcmc_minimal_historical/app"
          python3 tools/kcmc-minimal-repair-oct14/test_independent_safety.py
      - name: Actual PHP 8.2 syntax-only staging, apply, no-op and rollback
        run: |
          set -euo pipefail
          docker pull php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee
          kcmc_ci_php=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_ci_php"' EXIT
          python3 tests/workflow_source_layer.py --baseline-output "$kcmc_ci_php/app"
          cat > "$kcmc_ci_php/php" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$#" -eq 3 ] && [ "$1" = '-n' ] && [ "$2" = '-l' ]; then
            kcmc_ci_stage=$(dirname -- "$3")
            exec docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$kcmc_ci_stage,dst=$kcmc_ci_stage,readonly" \
              php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          fi
          exec docker run --rm --network none --user "$(id -u):$(id -g)" \
            php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          SH
          chmod 0700 "$kcmc_ci_php/php"
          PATH="$kcmc_ci_php:$PATH" python3 tools/kcmc-minimal-repair-oct14/verify-stage.py --runtime-root "$kcmc_ci_php/app"
  python36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Actual Python 3.6 historical transaction fixtures
        run: |
          set -euo pipefail
          git fetch --no-tags origin 00fdd469482564a3511a29a27a99502c24a32845 9cf2087ebc1608ea4fbf2f2a7cd68553de004964
          kcmc_minimal_historical=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_minimal_historical"' EXIT
          python3 tests/workflow_source_layer.py --baseline-output "$kcmc_minimal_historical/app"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$kcmc_minimal_historical/app,dst=/historical-runtime,readonly" \
            -w /source python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -c 'set -e; python3 tools/kcmc-minimal-repair-oct14/test_installer.py --runtime-root /historical-runtime; python3 tools/kcmc-minimal-repair-oct14/test_independent_safety.py'
