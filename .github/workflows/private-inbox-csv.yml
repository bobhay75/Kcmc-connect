name: KCMC private inbox CSV export

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/private-csv.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/connections-export.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/rsvps-export.php'
      - 'tests/private-inbox-csv-contract.php'
      - '.github/workflows/private-inbox-csv.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/private-csv.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/connections-export.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/rsvps-export.php'
      - 'tests/private-inbox-csv-contract.php'
      - '.github/workflows/private-inbox-csv.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/private-csv.php
          php -l KCMC-Connect-Phase6-Recreated/admin/connections-export.php
          php -l KCMC-Connect-Phase6-Recreated/admin/rsvps-export.php
          php -l tests/private-inbox-csv-contract.php
      - name: Private inbox CSV contract
        run: php tests/private-inbox-csv-contract.php
