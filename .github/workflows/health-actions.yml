name: KCMC actionable owner health checks
on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/health.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/release-health.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/operations-owner.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/screen-navigation.php'
      - 'KCMC-Connect-Phase6-Recreated/app-theme.css'
      - 'KCMC-Connect-Phase6-Recreated/admin/users.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/push.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/backup.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/restore.php'
      - 'tests/health-actions-*.py'
      - 'tests/health_actions_source_layer.py'
      - 'tests/fixtures/health-actions-reviewed.json'
      - 'tests/manual_clock_source_layer.py'
      - 'tests/member-account-routes.py'
      - 'tests/app-theme-browser.py'
      - '.github/workflows/health-actions.yml'
  push:
    branches: [main]
    paths:
      - 'KCMC-Connect-Phase6-Recreated/admin/health.php'
      - 'tests/health-actions-*.py'
      - 'tests/health_actions_source_layer.py'
      - 'tests/fixtures/health-actions-reviewed.json'
      - '.github/workflows/health-actions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Syntax and original health contracts
        run: |
          php -l KCMC-Connect-Phase6-Recreated/admin/health.php
          python3 -m py_compile tests/health-actions-browser.py
          php tests/release-health-contract.php
          php tests/health-follow-up-counts-contract.php
          git diff --check
      - name: Fetch immutable historical baseline for layered source proof
        run: git fetch --no-tags origin b0c257edb8a42fc89fd6371c1bce7ee3efbd5ed9
      - name: Exact health delta and unauthorized-change negative controls
        run: |
          python3 tests/health_actions_source_layer.py
          python3 tests/health-actions-source-negative.py
      - name: Real protected HTTP routes, filters and read-only work-area actions
        run: python3 tests/health-actions-browser.py --http-only
      - name: Browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Desktop, phone, keyboard and native controls without JavaScript
        run: python3 tests/health-actions-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kcmc-health-actions-acceptance
          path: test-artifacts/health-actions/
          retention-days: 7
          if-no-files-found: ignore
