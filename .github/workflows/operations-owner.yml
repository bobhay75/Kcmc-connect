name: KCMC owner operations access
on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/**'
      - 'tests/operations-owner-http.py'
      - 'tests/operations-owner-release.py'
      - 'tools/release-operations-owner.py'
      - 'tests/workflow_source_layer.py'
      - 'tests/phase_two_source_layer.py'
      - 'tests/fixtures/phase-two-workflows-reviewed.json'
      - '.github/workflows/operations-owner.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/release-operations-owner.py'
      - 'tests/operations-owner*.py'
      - '.github/workflows/operations-owner.yml'
permissions:
  contents: read
jobs:
  owner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact phase-one artifact source and older workflow baseline
        run: git fetch --no-tags origin 00fdd469482564a3511a29a27a99502c24a32845 9cf2087ebc1608ea4fbf2f2a7cd68553de004964
      - name: Original owner release and HTTP artifact proofs on exact phase-one source
        run: |
          set -euo pipefail
          kcmc_operations_historical=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_operations_historical"' EXIT
          python3 tests/workflow_source_layer.py --phase-one-output "$kcmc_operations_historical/KCMC-Connect-Phase6-Recreated"
          mkdir "$kcmc_operations_historical/tools" "$kcmc_operations_historical/tests"
          git show 9cf2087ebc1608ea4fbf2f2a7cd68553de004964:tools/release-operations-owner.py > "$kcmc_operations_historical/tools/release-operations-owner.py"
          git show 9cf2087ebc1608ea4fbf2f2a7cd68553de004964:tests/operations-owner-release.py > "$kcmc_operations_historical/tests/operations-owner-release.py"
          git show 9cf2087ebc1608ea4fbf2f2a7cd68553de004964:tests/operations-owner-http.py > "$kcmc_operations_historical/tests/operations-owner-http.py"
          python3 "$kcmc_operations_historical/tests/operations-owner-release.py"
          python3 "$kcmc_operations_historical/tests/operations-owner-http.py"
      - name: Current owner and prayer privacy capability contract
        run: php tests/owner-capabilities.php
