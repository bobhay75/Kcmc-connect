name: Apply pinned visitor review candidate
on:
  push:
    branches: ['fix/brighter-hero-visitor-welcome-20261008']
    paths: ['.github/workflows/apply-visitor-candidate.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/brighter-hero-visitor-welcome-20261008' && startsWith(github.event.head_commit.message, 'Apply pinned visitor source')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize only the pinned public and visitor source delta
        run: |
          set -euo pipefail
          python3 tools/apply-visitor-candidate.py
          python3 tests/installed-reconciliation-source.py
          php tests/visitor-welcome-contract.php
          php tests/connection-intake-contract.php
          bash tests/security-contract.sh
          node tests/public-photo-offline-source.cjs
          git diff --check
      - name: Save tested candidate to the isolated work branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KCMC-Connect-Phase6-Recreated/index.php KCMC-Connect-Phase6-Recreated/public-presentation.css KCMC-Connect-Phase6-Recreated/app.js KCMC-Connect-Phase6-Recreated/sw.js KCMC-Connect-Phase6-Recreated/api/connection.php KCMC-Connect-Phase6-Recreated/admin/connections.php tests/installed-reconciliation-source.py tests/visible-photos-review.py tests/public-photo-offline-browser.py tests/public-photo-offline-source.cjs tests/pwa-cache-privacy.cjs tests/security-contract.sh
          git commit -m 'Materialize exact brighter hero, visitor receipt and invitation candidate'
          git push origin HEAD:refs/heads/fix/brighter-hero-visitor-welcome-20261008
