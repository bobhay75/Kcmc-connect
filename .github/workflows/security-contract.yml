name: KCMC security contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show runtime versions
        run: |
          php --version
          node --version
          jq --version
      - name: Run security and behavior checks
        run: bash tests/security-contract.sh
