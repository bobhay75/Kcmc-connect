name: KCMC scoped credential-session hosting repair
on:
  pull_request:
    paths:
      - 'tools/kcmc-session-repair-oct15/**'
      - 'KCMC-Connect-Phase6-Recreated/lib/session-lifetime.php'
      - 'KCMC-Connect-Phase6-Recreated/lib/bootstrap.php'
      - 'KCMC-Connect-Phase6-Recreated/member/login.php'
      - 'KCMC-Connect-Phase6-Recreated/member/password.php'
      - 'tests/workflow_source_layer.py'
      - 'tests/phase_two_source_layer.py'
      - 'tests/fixtures/phase-two-workflows-reviewed.json'
      - '.github/workflows/session-host-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-python-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch only exact approved source objects
        run: git fetch --no-tags origin 154b779a0ea3d27a11300bfe0454f8a7c4aca355 93c72f4fc430d311e01108d3a30d0561bb701c9d 00fdd469482564a3511a29a27a99502c24a32845 9cf2087ebc1608ea4fbf2f2a7cd68553de004964
      - name: Exact generation, source membership and transactions
        run: |
          set -euo pipefail
          kcmc_session_historical=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_session_historical"' EXIT
          python3 tests/workflow_source_layer.py --phase-one-output "$kcmc_session_historical/app"
          cd tools/kcmc-session-repair-oct15
          sha256sum -c CHECKSUMS.sha256
          python3 -B derive_installer.py
          git diff --exit-code -- installer.py provenance.json
          python3 -B test_installer.py --runtime-root "$kcmc_session_historical/app" --git-root ../..
          python3 -B test_inherited_safety.py
      - name: Real PHP8.2 temporary four-file transaction
        run: |
          set -euo pipefail
          docker pull php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee
          kcmc_session_ci_php=$(mktemp -d)
          trap 'rm -f -- "$kcmc_session_ci_php/php"; rmdir -- "$kcmc_session_ci_php"' EXIT
          cat > "$kcmc_session_ci_php/php" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$#" -eq 3 ] && [ "$1" = '-n' ] && [ "$2" = '-l' ]; then
            kcmc_session_ci_stage=$(dirname -- "$3")
            exec docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$kcmc_session_ci_stage,dst=$kcmc_session_ci_stage,readonly" \
              php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          fi
          exec docker run --rm --network none --user "$(id -u):$(id -g)" \
            php@sha256:118ef4fb1db5e866fb604f2f260da81f819a0a1eac87a4083f9194f48e00beee php "$@"
          SH
          chmod 0700 "$kcmc_session_ci_php/php"
          python3 -B tools/kcmc-session-repair-oct15/verify-stage.py --php "$kcmc_session_ci_php/php"
  python36:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Actual Python3.6 exact source and temporary transactions
        run: |
          set -euo pipefail
          git fetch --no-tags origin 00fdd469482564a3511a29a27a99502c24a32845 9cf2087ebc1608ea4fbf2f2a7cd68553de004964
          kcmc_session_historical=$(mktemp -d)
          trap 'rm -rf -- "$kcmc_session_historical"' EXIT
          python3 tests/workflow_source_layer.py --phase-one-output "$kcmc_session_historical/app"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$kcmc_session_historical/app,dst=/phase-one-runtime,readonly" \
            -w /source/tools/kcmc-session-repair-oct15 \
            python@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc \
            bash -c 'set -e; python3 -B test_installer.py --runtime-root /phase-one-runtime; python3 -B test_inherited_safety.py'
