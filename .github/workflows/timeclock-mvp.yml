name: KCMC employee time clock MVP

on:
  pull_request:
    paths:
      - 'KCMC-Connect-Phase6-Recreated/lib/timeclock.php'
      - 'KCMC-Connect-Phase6-Recreated/member/timeclock.php'
      - 'KCMC-Connect-Phase6-Recreated/member/index.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/timecards.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/timecards-export.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/timecards-print.php'
      - 'KCMC-Connect-Phase6-Recreated/admin/operations.php'
      - 'tests/timeclock-mvp-contract.php'
      - '.github/workflows/timeclock-mvp.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l KCMC-Connect-Phase6-Recreated/lib/timeclock.php
          php -l KCMC-Connect-Phase6-Recreated/member/timeclock.php
          php -l KCMC-Connect-Phase6-Recreated/member/index.php
          php -l KCMC-Connect-Phase6-Recreated/admin/timecards.php
          php -l KCMC-Connect-Phase6-Recreated/admin/timecards-export.php
          php -l KCMC-Connect-Phase6-Recreated/admin/timecards-print.php
          php -l KCMC-Connect-Phase6-Recreated/admin/operations.php
          php -l tests/timeclock-mvp-contract.php
      - name: Time clock contract
        run: php tests/timeclock-mvp-contract.php
