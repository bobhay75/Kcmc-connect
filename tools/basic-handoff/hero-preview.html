<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCMC hero concept — review only</title>
<style>
:root{color-scheme:light;--ink:#214c3a;--muted:#e8eee6;--paper:#fbfaf5;--accent:#1f8a9c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.review{margin:0;padding:.65rem 1rem;background:#233d34;color:#fff;text-align:center;font:600 .8rem/1.4 system-ui,sans-serif}.bar{display:flex;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,5vw,4rem);border-bottom:1px solid #d6dfd6;font:600 .9rem/1.4 system-ui,sans-serif}.bar span{letter-spacing:.09em}.bar a{color:var(--ink)}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(2rem,5vw,5rem);width:min(1160px,calc(100% - 2rem));margin:auto;padding:clamp(2rem,5vw,5rem) 0}.logo{width:100%;max-width:480px;max-height:360px;object-fit:contain;display:block;mix-blend-mode:multiply}.copy{max-width:36rem}.eyebrow{font:700 .78rem/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3a7460}h1{font-size:clamp(2.4rem,5vw,4.4rem);line-height:1.08;letter-spacing:-.025em;margin:.5rem 0 1.2rem}p{font-size:1.15rem;line-height:1.65}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.6rem}.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:.8rem 1.4rem;border:1px solid var(--ink);border-radius:999px;color:#fff;background:var(--ink);font:700 .95rem/1.3 system-ui,sans-serif;text-decoration:none}.btn.secondary{background:transparent;color:var(--ink)}.services{background:var(--muted);padding:1.35rem;text-align:center}.services strong{display:block;font:700 .82rem/1.5 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}.services p{margin:.4rem 0;font-size:clamp(1.05rem,2vw,1.35rem)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center;gap:.75rem;padding:1.5rem 0 2.5rem}.logo{max-width:300px;max-height:240px;margin:auto}.copy{margin:auto}.actions{justify-content:center}.actions .btn{flex:1;min-width:145px}.bar{padding:.9rem 1rem}}
</style>
</head>
<body>
<p class="review">DESIGN CONCEPT — FOR REVIEW; LINKS ARE EXAMPLES</p>
<header class="bar"><span>KCMC CONNECT</span><a href="#services">Sunday services</a></header>
<main>
<section class="hero" aria-label="Welcome to Kimberling City Methodist Church">
<img class="logo" src="../../KCMC-Connect-Phase6-Recreated/assets/visuals/kcmc-bridge-logo.jpg" alt="Kimberling City Methodist Church logo">
<div class="copy"><span class="eyebrow">Kimberling City Methodist Church</span><h1>Welcome home.</h1><p>Come as you are. Find your place in worship and community.</p><div class="actions"><a class="btn" href="#services">Plan your visit</a><a class="btn secondary" href="#services">Watch online</a></div></div>
</section>
<section class="services" id="services"><strong>Sunday services</strong><p>8:00 AM &nbsp; • &nbsp; 9:15 AM &nbsp; • &nbsp; 10:30 AM</p></section>
</main>
</body>
</html>
